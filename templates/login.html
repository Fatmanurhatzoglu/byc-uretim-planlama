<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş — {{ app_title }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon">⚙</div>
      <h1>BYC Üretim Planlama</h1>
      <p>Devam etmek için giriş yapın</p>
    </div>
    {% if hata %}<div class="login-error">{{ hata }}</div>{% endif %}
    <form id="loginForm" method="POST">
      <div class="form-group"><label>Kullanıcı Adı</label><input name="kullanici_adi" id="kullaniciAdi" required autofocus></div>
      <div class="form-group"><label>Şifre</label><input name="sifre" type="password" id="sifre" required></div>
      <button type="submit" class="btn btn-primary login-btn">Giriş Yap</button>
    </form>
    <div class="login-hint">
      <p><strong>İlk giriş bilgileri:</strong></p>
      <p>Yönetici: admin / admin123</p>
      <p>Ofis: ofis / ofis123</p>
      <p>Saha: saha / saha123</p>
      <small>İlk girişten sonra şifrenizi değiştirin.</small>
    </div>
  </div>
</body>
</html>
